# Robo Arena online relay: room-code lobbies and quick match.
# Deploy: cd server && npx wrangler deploy
name = "robo-arena-net"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[durable_objects.bindings]]
name = "RATINGS"
class_name = "Ratings"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Lobby", "Ratings"]
